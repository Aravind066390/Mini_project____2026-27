<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOD Console</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>▶ VOD Console</h1>
  <div id="who" hidden><span id="whoName"></span> <button id="logout" class="ghost">Log out</button></div>
</header>

<main>
  <!-- Login -->
  <section id="loginView" class="card narrow">
    <h2>Sign in</h2>
    <form id="loginForm">
      <label>Username <input id="lu" required autocomplete="username"></label>
      <label>Password <input id="lp" type="password" required autocomplete="current-password"></label>
      <button>Connect</button>
    </form>
  </section>

  <!-- App -->
  <div id="appView" hidden>
    <nav>
      <button data-tab="library" class="active">Library</button>
      <button data-tab="upload">Upload</button>
      <button data-tab="files">Files</button>
      <button data-tab="users">Users</button>
    </nav>

    <section id="library" class="tab card">
      <h2>Search &amp; stream</h2>
      <form id="searchForm" class="row">
        <input id="genre" placeholder="Genres, comma-separated (e.g. Action, Sci-Fi)" required>
        <button>Search</button>
      </form>
      <div id="progress" class="bar" hidden><i></i></div>
      <div id="player"></div>
    </section>

    <section id="upload" class="tab card" hidden>
      <h2>Upload file</h2>
      <form id="uploadForm">
        <label>Recipient <input id="recipient" required></label>
        <label>File <input id="file" type="file" required></label>
        <button>Upload</button>
      </form>
      <div id="upBar" class="bar" hidden><i></i></div>
    </section>

    <section id="files" class="tab card" hidden>
      <h2>Delete file</h2>
      <form id="delForm" class="row">
        <input id="delName" placeholder="Filename" required>
        <button class="danger">Delete</button>
      </form>
    </section>

    <section id="users" class="tab card" hidden>
      <h2>User management</h2>
      <form id="userForm">
        <label>Username <input id="uName" required></label>
        <label>Password <input id="uPass" type="password"></label>
        <div class="row">
          <button data-act="ADD_USER">Add user</button>
          <button data-act="UPDATE_USER" class="ghost">Update password</button>
          <button data-act="DELETE_USER" class="danger">Delete user</button>
        </div>
      </form>
    </section>
  </div>

  <section class="card">
    <h2>Protocol log</h2>
    <div id="log"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
